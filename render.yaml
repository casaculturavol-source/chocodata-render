services:
  - type: web
    name: chocodata-turismo
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/salud
    envVars:
      - key: CHOCODATA_PUBLIC_DEMO
        value: "1"
